# Copy to your repo: .github/workflows/release-with-jira.yml
# Add secrets in YOUR repo: JIRA_EMAIL, JIRA_API_TOKEN

name: Release with Jira notes

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      jira_tasks:
        required: true
        type: string
      jira_base_url:
        required: true
        type: string
      pre_release:
        required: false
        type: boolean
        default: false
      release_log_url:
        required: false
        type: string
      create_tag:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: alfahadiqbal/jira-release-notes-action@v1
        with:
          version: ${{ inputs.version }}
          jira_tasks: ${{ inputs.jira_tasks }}
          jira_base_url: ${{ inputs.jira_base_url }}
          pre_release: ${{ inputs.pre_release }}
          release_log_url: ${{ inputs.release_log_url }}
          create_tag: ${{ inputs.create_tag }}
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
